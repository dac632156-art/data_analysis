<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cohort Analysis - 完美留存率矩阵 (卡片幕布版)</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        body { 
            background-color: #F1F5F9; 
            margin: 0; padding: 40px; 
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; box-sizing: border-box;
        }

        .dashboard-wrapper {
            position: relative;
            width: 1280px; 
            height: 680px; 
            background-image: url('./背景.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            border-radius: 24px;
            box-shadow: 
                0 20px 40px -10px rgba(99, 102, 241, 0.1),
                0 10px 20px -5px rgba(56, 189, 248, 0.08),  
                0 0 0 1px rgba(255, 255, 255, 0.8);
            padding: 24px 30px 10px 30px;
            overflow: hidden; 
        }

        .content-layer {
            position: relative;
            z-index: 10; 
            width: 100%;
            height: 100%;
        }

        /* 高度/宽度交由组件内部设定（100% 宽、默认 680px 高），此处不强行覆盖 */
        #chart-container {
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .retention-legend-bar {
            position: absolute;
            top: 320px; 
            right: 68px;
            width: 8px;
            height: 160px;
            background: linear-gradient(to bottom, #FFAECC 0%, #FCB8D7 20%, #F6C3E2 40%, #EDCEEC 60%, #E2DAF4 80%, #D6E5FA 100%);
            border-radius: 6px;
            z-index: 20;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
        }

        .retention-legend-label-top {
            position: absolute;
            top: 315px; 
            right: 83px;
            font-size: 10px;
            color: #64748B;
            font-weight: 600;
            z-index: 20;
            transform: rotate(-90deg);
            transform-origin: right center;
        }

        .retention-legend-label-bottom {
            position: absolute;
            top: 485px; 
            right: 83px;
            font-size: 10px;
            color: #64748B;
            font-weight: 600;
            z-index: 20;
            transform: rotate(-90deg);
            transform-origin: right center;
        }
    </style>
</head>
<body>

    <div class="dashboard-wrapper">
        <div id="legend-top" class="retention-legend-label-top">Max</div>
        <div class="retention-legend-bar"></div>
        <div id="legend-bottom" class="retention-legend-label-bottom">Min</div>

        <div class="content-layer">
            <div id="chart-container"></div>
        </div>
    </div>

    <script>
        async function fetchAndRender() {
            const chartDom = document.getElementById('chart-container');
            const myChart = echarts.init(chartDom);
            
            myChart.showLoading({ text: '正在加载大盘数据...', color: '#6366F1', textColor: '#475569', maskColor: 'rgba(255, 255, 255, 0.6)' });

            try {
                const response = await fetch('mock6.json'); 
                const result = await response.json();
                
                const cohortPackage = result.packages.find(p => p.id === 'cohort' || p.analysis_type === 'cohort');
                if (!cohortPackage) return;

                const retentionChart = cohortPackage.chart_data.find(c => c.slot === 'cohort_retention');
                const rawJsonData = retentionChart.data;

                const allMonths = [...new Set(rawJsonData.map(item => item['首单月']))].sort();
                const yAxisData = allMonths.slice(-12);
                const MAX_COLUMNS = 12; 
                const xAxisData = Array.from({length: MAX_COLUMNS}, (_, i) => 'W' + i);

                const dataValid = [];  
                const dataW0 = [];     
                const dataEmpty = [];  
                let minVal = Infinity, maxVal = -Infinity;

                yAxisData.forEach((yMonth, yIndex) => {
                    for (let xIndex = 0; xIndex < MAX_COLUMNS; xIndex++) {
                        const target = rawJsonData.find(item => item['首单月'] === yMonth && item['Index_j'] === xIndex);
                        if (target && target.value !== -1 && target.value !== null && target.value !== undefined) {
                            const val = target.value;
                            if (xIndex === 0) { dataW0.push([xIndex, yIndex, val]); } 
                            else { dataValid.push([xIndex, yIndex, val]); if (val < minVal) minVal = val; if (val > maxVal) maxVal = val; }
                        } else { dataEmpty.push([xIndex, yIndex, 0]); }
                    }
                });

                if (minVal === Infinity) minVal = 0;
                if (maxVal === -Infinity) maxVal = 0.1;
                document.getElementById('legend-top').innerText = (maxVal * 100).toFixed(1) + '%';
                document.getElementById('legend-bottom').innerText = (minVal * 100).toFixed(1) + '%';

                const option = {
                    backgroundColor: 'transparent',
                    // --- 工具箱添加 ---
                    toolbox: {
                        right: 40, top: 10,
                        feature: {
                            saveAsImage: { title: '下载图片', show: true },
                            myExport: {
                                show: true, title: '导出数据',
                                icon: 'path://M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z',
                                onclick: function() {
                                    const exportData = [...dataValid, ...dataW0];
                                    const blob = new Blob([JSON.stringify(exportData)], {type: 'application/json'});
                                    const url = URL.createObjectURL(blob);
                                    const a = document.createElement('a');
                                    a.href = url; a.download = 'retention_data.json'; a.click();
                                }
                            }
                        }
                    },
                    // ----------------
                    title: { text: 'COHORT ANALYSIS: USER RETENTION MATRIX', left: 'center', top: '11%', textStyle: { color: '#1E293B', fontSize: 22, fontWeight: 'bold', fontFamily: "'Microsoft YaHei', sans-serif" } },
                    tooltip: { position: 'top', backgroundColor: 'rgba(255, 255, 255, 0.95)', borderColor: '#E2E8F0', borderWidth: 1, extraCssText: 'box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); border-radius: 8px;', textStyle: { color: '#475569', fontWeight: 'bold' }, formatter: function (p) { if (p.seriesName === '无数据') return ''; const yMonth = yAxisData[p.value[1]]; return `${yMonth} <br/> W${p.value[0]} 留存率: <span style="color:#FCB8D7">${(p.value[2] * 100).toFixed(2)}%</span>`; } },
                    grid: { top: '20%', bottom: '5%', left: '13%', right: '7%', containLabel: false },
                    xAxis: { type: 'category', position: 'bottom', data: xAxisData, splitArea: { show: false }, axisLabel: { color: '#64748B', fontWeight: 'bold', fontSize: 14, margin: 12 }, axisLine: { show: false }, axisTick: { show: false } },
                    yAxis: { type: 'category', data: yAxisData, inverse: true, splitArea: { show: false }, axisLabel: { color: '#475569', fontWeight: 'bold', fontSize: 14, margin: 16, formatter: function (value) { const date = new Date(value + '-01'); const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]; return monthNames[date.getMonth()] + " '" + value.substring(2,4); } }, axisLine: { show: false }, axisTick: { show: false } },
                    visualMap: { type: 'continuous', seriesIndex: 0, min: minVal, max: maxVal, show: false, inRange: { color: ['#D6E5FA', '#E2DAF4', '#EDCEEC', '#F6C3E2', '#FCB8D7', '#FFAECC'] } },
                    series: [
                        { name: '有效留存', type: 'heatmap', data: dataValid, itemStyle: { borderColor: '#FFFFFF', borderWidth: 4, borderRadius: 6 }, label: { show: true, color: '#475569', fontWeight: 'bold', fontSize: 11, formatter: function (p) { return p.value[2] === 0 ? '0.0%' : (p.value[2] * 100).toFixed(1) + '%'; } } },
                        { name: 'W0初始留存', type: 'heatmap', data: dataW0, itemStyle: { color: '#FF9EA6', borderColor: '#FFFFFF', borderWidth: 4, borderRadius: 6 }, label: { show: true, color: '#881337', fontWeight: 'bold', fontSize: 11, formatter: function (p) { return (p.value[2] * 100).toFixed(1) + '%'; } } },
                        { name: '无数据', type: 'heatmap', data: dataEmpty, itemStyle: { color: 'rgba(248, 250, 252, 0.7)', borderColor: '#FFFFFF', borderWidth: 4, borderRadius: 6 }, label: { show: false }, tooltip: { show: false } }
                    ]
                };

                myChart.hideLoading();
                myChart.setOption(option);
                window.addEventListener('resize', () => myChart.resize());

            } catch (error) {
                console.error("加载数据失败:", error);
                myChart.hideLoading();
            }
        }

        fetchAndRender();
    </script>
</body>
</html>
