<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>净GMV vs 净毛利 - 仙气高级双轴图</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            background-image: url('./背景.png'); /* 请确保目录下有背景.png */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            padding: 40px;
        }

        /* 高级毛玻璃卡片底座 */
        .dashboard-card { 
            width: 950px;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px; 
            box-shadow: 
                0 20px 40px -10px rgba(0, 0, 0, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            padding: 40px; 
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* 顶部标题与按钮 */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding-bottom: 20px;
        }

        .title {
            font-size: 18px;
            font-weight: 700;
            color: #1E293B;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .title span { color: #94A3B8; font-weight: 500; text-transform: none; margin-left: 8px;}

        .btn-select {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.9);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
        }

        /* KPI 指标区 */
        .kpi-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 40px 0;
        }

        .kpi-item {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .kpi-label {
            font-size: 12px;
            color: #64748B;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .kpi-value {
            font-size: 32px;
            color: #0F172A;
            font-weight: 700;
        }

        /* 图表容器 */
        #chart-container { 
            width: 100%; 
            height: 400px; 
        }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <!-- 头部 -->
        <div class="card-header">
            <div class="title">Net GMV & Net Profit <span>| 净GMV与净毛利对比</span></div>
            <div class="btn-select">
                按同期群 (Cohort View)
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
        </div>

        <!-- 动态 KPI 数据 -->
        <div class="kpi-row">
            <div class="kpi-item">
                <div class="kpi-label">Total Net GMV</div>
                <div class="kpi-value" id="kpi-gmv">--</div>
            </div>
            <div class="kpi-item">
                <div class="kpi-label">Total Net Profit</div>
                <div class="kpi-value" id="kpi-profit">--</div>
            </div>
            <div class="kpi-item">
                <div class="kpi-label">Avg. Profit Margin</div>
                <div class="kpi-value" id="kpi-margin">--</div>
            </div>
        </div>

        <!-- ECharts 图表 -->
        <div id="chart-container"></div>
    </div>

    <script>
        const myChart = echarts.init(document.getElementById('chart-container'));

        // JSON 数据
        const xAxisData = ["2024-11", "2024-12", "2025-01", "2025-02", "2025-03", "2025-04", "2025-05", "2025-06", "2025-07", "2025-08", "2025-09", "2025-10"];
        const gmvData = [40839.94, 46063.44, 54722.69, 32089.95, 43602.28, 40384.36, 33993.41, 24379.17, 29168.07, 40341.47, 31280.19, 35074.96];
        const profitData = [12679.95, 12719.64, 14424.53, 9683.78, 13514.91, 13689.98, 11140.99, 9211.18, 8274.23, 11007.13, 9132.42, 11251.15];

        // 计算 KPI
        const totalGMV = gmvData.reduce((a, b) => a + b, 0);
        const totalProfit = profitData.reduce((a, b) => a + b, 0);
        const avgMargin = (totalProfit / totalGMV) * 100;

        document.getElementById('kpi-gmv').innerText = '¥' + (totalGMV / 1000).toFixed(1) + 'K';
        document.getElementById('kpi-profit').innerText = '¥' + (totalProfit / 1000).toFixed(1) + 'K';
        document.getElementById('kpi-margin').innerText = avgMargin.toFixed(1) + '%';

        // ECharts 配置
        const option = {
            backgroundColor: 'transparent', 
            
           tooltip: {
                trigger: 'axis',
                backgroundColor: 'rgba(255, 255, 255, 0.85)',
                borderColor: '#E2E8F0',
                borderWidth: 1,
                padding: [12, 16],
                textStyle: { color: '#475569', fontWeight: 'bold' },
                extraCssText: 'box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); backdrop-filter: blur(8px); border-radius: 12px;',
                axisPointer: { type: 'none' },
                formatter: function (params) {
                    let html = `<div style="margin-bottom:8px;color:#64748B;font-size:13px;">${params[0].name}</div>`;
                    params.forEach(item => {
                        let marker = item.marker;
                        // 强制修复净毛利的图标，画一个粉边白底的空心圆点
                        if (item.seriesName === 'Net Profit (净毛利)') {
                            marker = '<span style="display:inline-block;margin-right:6px;border-radius:50%;width:10px;height:10px;box-sizing:border-box;background-color:#fff;border:2px solid #F472B6;"></span>';
                        }
                        // 给数值增加千位分隔符并保留两位小数
                        let valueStr = Number(item.value).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                        html += `<div style="display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:4px;">
                                    <span style="display:flex;align-items:center;">${marker}${item.seriesName}</span>
                                    <span style="color:#0F172A;font-weight:700;">${valueStr}</span>
                                 </div>`;
                    });
                    return html;
                }
            },

            legend: {
                data: ['Net GMV (净GMV)', 'Net Profit (净毛利)'],
                bottom: 0,
                itemGap: 30,
                textStyle: { color: '#64748B', fontWeight: 600, fontSize: 13 },
                icon: 'circle'
            },

            grid: { top: 40, left: 20, right: 20, bottom: 40, containLabel: true },

            xAxis: {
                type: 'category',
                data: xAxisData,
                axisLine: { show: false }, 
                axisTick: { show: false }, 
                axisLabel: { 
                    color: '#64748B', 
                    fontWeight: 600, 
                    fontSize: 12,
                    margin: 16
                }
            },

            yAxis: [
                {
                    type: 'value',
                    name: 'NET GMV (¥)',
                    nameTextStyle: { color: '#94A3B8', fontWeight: 600, fontSize: 11, padding: [0, 0, 0, 40] },
                    position: 'left',
                    axisLine: { show: false },
                    axisTick: { show: false },
                    axisLabel: { 
                        color: '#94A3B8', 
                        fontWeight: 600,
                        formatter: (val) => (val === 0 ? '0' : (val / 1000) + 'K')
                    },
                    splitLine: { 
                        lineStyle: { type: 'dashed', color: 'rgba(0, 0, 0, 0.05)' } 
                    }
                },
                {
                    type: 'value',
                    name: 'NET PROFIT (¥)',
                    nameTextStyle: { color: '#94A3B8', fontWeight: 600, fontSize: 11, padding: [0, 40, 0, 0] },
                    position: 'right',
                    axisLine: { show: false },
                    axisTick: { show: false },
                    axisLabel: { 
                        color: '#94A3B8', 
                        fontWeight: 600,
                        formatter: (val) => (val === 0 ? '0' : (val / 1000) + 'K')
                    },
                    splitLine: { show: false } 
                }
            ],

            series: [
                {
                    name: 'Net GMV (净GMV)',
                    type: 'bar',
                    yAxisIndex: 0,
                    data: gmvData,
                    barWidth: 26, // 稍微再调细一点点，更优雅
                    itemStyle: {
                        // 【优化点1】调实了底部的不透明度，增强胶囊的实体感
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: 'rgba(195, 225, 250, 0.95)' }, // 顶部冰蓝
                            { offset: 1, color: 'rgba(195, 225, 250, 0.6)' }  // 底部调实，不再消失
                        ]),
                        // 【优化点2】上下全部圆角，彻底变成胶囊形状
                        borderRadius: 14, 
                    }
                },
                {
                    name: 'Net Profit (净毛利)',
                    type: 'line',
                    yAxisIndex: 1,
                    data: profitData,
                    smooth: true,        
                    symbol: 'circle',
                    symbolSize: 8,       
                    itemStyle: {
                        color: '#ffffff',       
                        borderColor: '#F472B6', 
                        borderWidth: 2,
                        shadowColor: 'rgba(244, 114, 182, 0.8)', 
                        shadowBlur: 6
                    },
                    lineStyle: {
                        color: '#F472B6', 
                        width: 3,
                        shadowColor: 'rgba(244, 114, 182, 0.3)',
                        shadowBlur: 10,
                        shadowOffsetY: 6
                    }
                }
            ]
        };

        myChart.setOption(option, true);
        window.addEventListener('resize', () => myChart.resize());
    </script>
</body>
</html>
