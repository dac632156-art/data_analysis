# 列名映射词典（无歧义词典）
# 格式：标准字段名 -> 该字段可能的所有原始列名变体（中英文均可）
# 标准字段名是下游分析使用的「规范列名」（中文语义名）。
#
# 重要：有歧义的列名（如 name，在客户表/订单表含义不同）不要写进本词典，
#       这类列会由系统按整表指纹 / 包含度 / 相似度 / LLM 自动解析归属。
# 写入本词典的变体必须无歧义（每个变体只对应唯一标准字段）。
