# 词频/词云分析 —— 文本/分类列中各类别的出现频率
# V1：基于 RankingCalculator，按类别出现次数生成词云图
intent: wordcloud
display_name: 词频/词云分析
description: 统计分类列中各类别的出现次数，生成词云图展示最热门项目
level: L1

template: wordcloud_analysis
template_module: src.analysis_templates.wordcloud_analysis.WordCloudAnalysis
calculator: src.calculators.ranking.RankingCalculator
default_algorithm: null
supported_algorithms: []

keywords:
  - 词云
  - 词频
  - 频率
  - 热门
  - 出现次数
  - 最多
  - 最热
  - 流行

business_questions:
  - 哪些产品名称最热门？
  - 哪些类别出现次数最多？
  - 文本关键词分布如何？

priority: 88

schema_requirements:
  dimension_type: category
  metric_type: ""
  min_dimension: 1
  min_metric: 0
  min_rows: 3
  min_distinct_values: 2

required_fields:
  - 产品
  - 类别
  - 名称
  - 渠道
  - 客户
  - 地区
  - 城市
  - 类型
  - 行业

outputs:
  charts:
    - name: word_cloud
      label: 词云图
      description: 各类别出现次数的词云展示
  tables:
    - name: frequency_detail
      label: 词频明细表
      description: 类别、出现次数、占比%
  kpis:
    - name: total_words
      label: 总词条数
      description: 数据中总记录数
    - name: unique_words
      label: 独立词条数
      description: 不同类别的数量
    - name: top1_word
      label: 最高频词
      description: 出现次数最多的类别

derived_metrics:
  - top1
  - top3_share
  - cumulative_share
  - rank

examples:
  - 哪些产品名称最热门？
  - 哪些类别出现次数最多？
  - 词云图分布

fallback:
  - ranking

generator_rules:
  - requires: ["category"]
    priority: high
    reason: 有分类列，可生成词云展示各类别出现频率
    question_template: "哪些{cat0}最热门？"
    goal_template: "{cat0}的词频分析"
