# 分布分析 —— 数值的分布形态与频次
# V3：扩展为完整分析知识
intent: distribution
display_name: 分布分析
description: 分析数值数据的分布形态（均值/中位数/标准差/偏度/峰度/分位数/IQR/直方图）
level: L1

template: distribution_analysis
template_module: src.analysis_templates.distribution_analysis.DistributionAnalysis
calculator: src.calculators.distribution.DistributionCalculator
default_algorithm: null
supported_algorithms: []

keywords:
  - 分布
  - 分散
  - 直方图
  - 频率
  - 区间
  - 分箱
  - 离散
  - 偏态
  - 数值分布
  - 频次分布
  - 频次分析

business_questions:
  - 销售额分布是怎样的？
  - 客户消费金额集中在哪个区间？
  - 数据是否正态分布？
  - 数值离散程度如何？

priority: 75

schema_requirements:
  dimension_type: ""
  metric_type: numeric
  min_dimension: 0
  min_metric: 1
  min_rows: 3
  min_distinct_values: 2

required_fields:
  - 销售额
  - 数量
  - 金额
  - 价格

outputs:
  charts:
    - name: histogram
      label: 分布直方图
      description: 数值分布的频率直方图
  tables:
    - name: distribution_table
      label: 区间分布表
      description: 区间和对应频次
  kpis:
    - name: mean
      label: 均值
      description: 数据的算术平均值
    - name: median
      label: 中位数
      description: 数据的中位数
    - name: std_dev
      label: 标准差
      description: 数据的离散程度
    - name: skewness
      label: 偏度
      description: 分布的不对称程度
    - name: iqr
      label: 四分位距
      description: Q3-Q1

derived_metrics:
  - mean
  - median
  - std_dev
  - skewness
  - kurtosis
  - iqr

examples:
  - 销售额分布是怎样的？
  - 客户消费金额集中在哪个区间？
  - 数据是否正态分布？

fallback:
  - structure

generator_rules:
  - requires: ["numeric"]
    priority: low
    reason: 了解数据分布形态
    question_template: "{num0}的分布如何？"
    goal_template: "{num0}的分布分析"
