# 排名分析 —— Top/Bottom N 对比排名
# V3：扩展为完整分析知识
intent: ranking
display_name: 排名分析
description: 按维度对比排名，识别表现最好和最差的分类，提供占比和累计占比分析
level: L1

template: ranking_analysis
template_module: src.analysis_templates.ranking_analysis.RankingAnalysis
calculator: src.calculators.ranking.RankingCalculator
default_algorithm: null
supported_algorithms: []

keywords:
  - 排名
  - 最高
  - 最低
  - TOP
  - top
  - 排行
  - 第一
  - 最大
  - 最小
  - 靠前
  - 靠后
  - 前几名

business_questions:
  - 哪个分类表现最好？
  - 哪些分类贡献最高？
  - 排名前5的是哪些？
  - 最差的分类是哪些？

priority: 90

schema_requirements:
  dimension_type: category
  metric_type: numeric
  min_dimension: 1
  min_metric: 1
  min_rows: 3
  min_distinct_values: 2

required_fields:
  - 分类
  - 产品
  - 地区
  - 客户

outputs:
  charts:
    - name: ranking_bar
      label: 排名柱状图
      description: TopN分类的数值排名对比
    - name: cumulative_curve
      label: 累计占比曲线
      description: 帕累托累计占比曲线
  tables:
    - name: ranking_detail
      label: 排名明细表
      description: 排名、分类、指标值、占比%、累计占比%
  kpis:
    - name: top1_value
      label: Top1指标值
      description: 排名第一的分类的指标值
    - name: top3_concentration
      label: Top3集中度
      description: 前3名合计占比
    - name: top10_cumulative
      label: Top10累计贡献
      description: 前10名累计占比

derived_metrics:
  - top1
  - top3_share
  - cumulative_share
  - rank

examples:
  - 哪个产品销售额最高？
  - 哪些地区贡献最高？
  - 销售额排名前5的是哪些？
  - 谁的表现最差？

fallback:
  - structure

generator_rules:
  - requires: ["category", "numeric"]
    priority: high
    reason: 有分类和数值列，排名是核心关注点
    question_template: "哪个{cat0}的{num0}最高？"
    goal_template: "{cat0}的{num0}排名对比"