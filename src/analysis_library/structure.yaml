# 结构分析 —— 各部分在整体中的构成结构
# V3：扩展为完整分析知识
intent: structure
display_name: 结构分析
description: 分析各分类在整体中的结构占比与构成，识别头部集中度
level: L1

template: structure_analysis
template_module: src.analysis_templates.structure_analysis.StructureAnalysis
calculator: src.calculators.ranking.RankingCalculator
default_algorithm: null
supported_algorithms: []

keywords:
  - 构成
  - 结构
  - 组成
  - 占比分布
  - 各占多少
  - 比重
  - 占比
  - 比例
  - 饼图
  - 结构分析
  - 构成分析

business_questions:
  - 各地区销售占比是多少？
  - 各品类构成如何？
  - 市场份额怎么分布？
  - 哪个品类占比最高？

priority: 84

schema_requirements:
  dimension_type: category
  metric_type: numeric
  min_dimension: 1
  min_metric: 1
  min_rows: 2
  min_distinct_values: 2

required_fields:
  - 分类
  - 产品
  - 地区
  - 客户

outputs:
  charts:
    - name: structure_pie
      label: 结构饼图
      description: 各分类的结构占比饼图
  tables:
    - name: structure_detail
      label: 结构明细表
      description: 分类、指标值、结构占比%
  kpis:
    - name: total_metric
      label: 总指标值
      description: 分析指标的总和
    - name: top3_share
      label: Top3结构占比
      description: 前3名的合计占比
    - name: category_count
      label: 分类数量
      description: 分类维度有多少个不同值

derived_metrics:
  - top3_share
  - category_count

examples:
  - 各地区销售占比是多少？
  - 各品类构成如何？
  - 市场份额怎么分布？

fallback:
  - ranking

generator_rules:
  - requires: ["category", "numeric"]
    priority: medium
    reason: 了解分类构成
    question_template: "各{cat0}的{num0}占比如何？"
    goal_template: "{cat0}的{num0}结构分析"
