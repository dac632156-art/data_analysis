# 复购分析 —— 客户重复购买行为分析
# V3：扩展为完整分析知识
intent: retention
display_name: 复购分析
description: 分析客户复购率，识别重复购买客户占比、复购频次分布和产品复购排行
level: L3

template: retention_analysis
template_module: src.analysis_templates.retention_analysis.RetentionAnalysis
calculator: src.calculators.retention.RetentionCalculator
default_algorithm: null
supported_algorithms: []

keywords:
  - 复购
  - 回头客
  - 重复购买
  - 留存
  - 回购
  - 复购率
  - 忠诚度
  - 老客户
  - 再次购买
  - 复购客户

business_questions:
  - 复购率高吗？
  - 哪些客户复购最多？
  - 回头客占比多少？
  - 客户平均购买几次？
  - 哪个产品的复购率最高？

priority: 88

schema_requirements:
  dimension_type: category
  metric_type: numeric
  min_dimension: 1
  min_metric: 1
  min_rows: 3
  min_distinct_values: 2

required_fields:
  - 客户ID
  - 客户
  - 订单号
  - 订单日期

outputs:
  charts:
    - name: frequency_bar
      label: 购买频次分布图
      description: 不同购买次数的客户数量分布
    - name: retention_pie
      label: 复购客户占比饼图
      description: 复购客户vs单次客户占比
  tables:
    - name: frequency_table
      label: 购买频次分布表
      description: 购买次数和对应客户数量
  kpis:
    - name: retention_rate
      label: 复购率
      description: 购买≥2次的客户占比
    - name: repeat_customer_count
      label: 复购客户数
      description: 有复购行为的客户数量
    - name: total_customer_count
      label: 总客户数
      description: 全部客户数量
    - name: avg_purchase_frequency
      label: 人均购买次数
      description: 客户平均购买频次

derived_metrics:
  - repeat_purchase_rate
  - repeat_customer_count
  - avg_purchase_frequency

examples:
  - 复购率高吗？
  - 哪些产品复购率最高？
  - 回头客占比多少？
  - 客户平均购买几次？

fallback:
  - ranking
  - structure

generator_rules:
  - requires: ["category", "numeric"]
    priority: medium
    reason: 检测到客户相关字段，可进行复购分析
    question_template: "客户复购率如何？"
    goal_template: "客户复购率分析"
