# 对比分析 —— 分组差异对比、差异率、提升度
# V3：扩展为完整分析知识
intent: comparison
display_name: 对比分析
description: 对比多个分类组之间的指标差异，识别优劣和差异程度（差异/差异率/提升度）
level: L3

template: comparison_analysis
template_module: src.analysis_templates.comparison_analysis.ComparisonAnalysis
calculator: src.calculators.comparison.ComparisonCalculator
default_algorithm: null
supported_algorithms: []

keywords:
  - 对比
  - 比较
  - 差异
  - 区别
  - 哪个更
  - 相比
  - 之间对比
  - 好坏对比
  - 对比分析
  - 分组对比

business_questions:
  - 线上VS线下哪个利润更高？
  - 两个产品线对比哪个更好？
  - A组和B组有什么区别？
  - 不同渠道的转化率对比？

priority: 87

schema_requirements:
  dimension_type: category
  metric_type: numeric
  min_dimension: 1
  min_metric: 1
  min_rows: 3
  min_distinct_values: 2

required_fields:
  - 分类
  - 渠道
  - 产品线
  - 组别

outputs:
  charts:
    - name: comparison_bar
      label: 分组对比柱图
      description: 各分类组的均值对比
    - name: difference_bar
      label: 差异柱图
      description: 各组vs全局均值的差异
  tables:
    - name: comparison_detail
      label: 对比明细表
      description: 分类、均值、vs全局差异、差异率%
  kpis:
    - name: global_mean
      label: 全局均值
      description: 所有分组的整体均值
    - name: best_group
      label: 最优组
      description: 均值最高的分组及其值
    - name: max_gap
      label: 组间最大差距
      description: 最优组与最弱组的差异百分比

derived_metrics:
  - difference
  - difference_rate
  - global_mean

examples:
  - 线上VS线下哪个利润更高？
  - 两个产品线对比哪个更好？
  - A组和B组有什么区别？
  - 不同渠道的转化率对比？

fallback:
  - ranking
  - structure

generator_rules:
  - requires: ["category", "numeric"]
    priority: medium
    reason: 有分类和数值列，可进行对比分析
    question_template: "各{cat0}的{num0}对比如何？"
    goal_template: "各{cat0}的{num0}对比分析"
