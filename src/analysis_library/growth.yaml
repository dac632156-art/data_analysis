# 增长分析 —— 指标随时间的变化趋势与增长率
# V3：扩展为完整分析知识
intent: growth
display_name: 增长分析
description: 分析指标随时间的变化趋势，支持同比(YoY)、环比(MoM)、季环比(QoQ)三种对比算法，提供移动平均和趋势拐点检测
level: L2

template: growth_analysis
template_module: src.analysis_templates.growth_analysis.GrowthAnalysis
calculator: src.calculators.growth.GrowthCalculator
default_algorithm: yoy
supported_algorithms:
  - yoy
  - mom
  - qoq

keywords:
  - 增长
  - 趋势
  - 同比
  - 环比
  - 放缓
  - 走势
  - 波动趋势
  - 增长率
  - 增速
  - 增长趋势
  - 时间趋势
  - 增长分析

business_questions:
  - 销售增长怎么样？
  - 同比增长了多少？
  - 增长趋势是否放缓了？
  - 哪个周期增长最快？
  - 未来趋势如何？

priority: 95

schema_requirements:
  dimension_type: time
  metric_type: numeric
  min_dimension: 1
  min_metric: 1
  min_rows: 3
  min_distinct_values: 3

required_fields:
  - 日期
  - 时间
  - 销售额
  - 订单量

outputs:
  charts:
    - name: trend_line
      label: 趋势折线图
      description: 核心指标随时间变化的趋势折线
    - name: growth_rate_bar
      label: 增长率柱状图
      description: 各周期的YoY/MoM增长率对比
    - name: cumulative_area
      label: 累计面积图
      description: 核心指标的累计增长趋势
    - name: moving_average_line
      label: 移动平均线
      description: 3期移动平均平滑趋势
  tables:
    - name: growth_detail
      label: 增长率明细表
      description: 周期、指标值、增长率、移动平均、累计值的完整明细
  kpis:
    - name: total_metric
      label: 总指标值
      description: 分析期内指标总和
    - name: avg_growth_rate
      label: 平均增长率
      description: 分析期内YoY/MoM的平均值
    - name: peak_period
      label: 峰值周期
      description: 指标达到最大值的周期
    - name: trough_period
      label: 低谷周期
      description: 指标达到最小值的周期

derived_metrics:
  - yoy
  - mom
  - qoq
  - growth_rate
  - moving_average
  - cumulative_growth
  - trend_change_point

examples:
  - 销售增长怎么样？
  - 哪个月增长最快？
  - 同比增长多少？
  - 销售额的变化趋势是什么？
  - 最近增长是否放缓了？

fallback:
  - ranking
  - structure

generator_rules:
  - requires: ["time", "numeric"]
    priority: high
    reason: 有时间和数值列，趋势是核心关注点
    question_template: "{num0}的增长趋势如何？"
    goal_template: "分析{num0}的增长趋势"