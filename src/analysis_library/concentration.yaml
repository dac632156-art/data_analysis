# 集中度分析 —— 帕累托效应、CR3/CR5、HHI指数
# V3：扩展为完整分析知识
intent: concentration
display_name: 集中度分析
description: 判断数据是否高度集中在少数分类中（帕累托效应/二八法则），计算CR3/CR5/HHI/Top20%贡献率
level: L2

template: concentration_analysis
template_module: src.analysis_templates.concentration_analysis.ConcentrationAnalysis
calculator: src.calculators.concentration.ConcentrationCalculator
default_algorithm: pareto
supported_algorithms:
  - pareto
  - hhi
  - gini

keywords:
  - 二八
  - 帕累托
  - pareto
  - hhi
  - 基尼
  - gini
  - 集中度
  - 集中
  - 少数
  - 头部
  - 贡献度

business_questions:
  - 销售是否存在二八效应？
  - 头部客户贡献了多少？
  - 集中度高吗？
  - 市场是否被少数玩家垄断？

priority: 85

schema_requirements:
  dimension_type: category
  metric_type: numeric
  min_dimension: 1
  min_metric: 1
  min_rows: 3
  min_distinct_values: 3

required_fields:
  - 分类
  - 产品
  - 客户
  - 销售

outputs:
  charts:
    - name: concentration_bar
      label: 集中度分布柱图
      description: 各分类的指标值分布
    - name: pareto_curve
      label: 帕累托累计曲线
      description: 按降序排列的累计占比曲线
  tables:
    - name: concentration_detail
      label: 集中度明细表
      description: 分类、指标值、占比%、累计占比%
  kpis:
    - name: hhi_index
      label: HHI指数
      description: 赫芬达尔-赫希曼指数（0-10000）
    - name: cr3
      label: CR3集中度
      description: 前3名合计占比
    - name: cr5
      label: CR5集中度
      description: 前5名合计占比
    - name: top20_contribution
      label: Top20%贡献率
      description: Top20%分类贡献的指标占比

derived_metrics:
  - hhi
  - cr3
  - cr5
  - pareto_ratio
  - top20_share

examples:
  - 销售是否存在二八效应？
  - 头部客户贡献了多少？
  - 集中度高吗？
  - 是否依赖少数几个产品？

fallback:
  - ranking
  - structure

generator_rules:
  - requires: ["category", "numeric"]
    priority: low
    reason: 有分类和数值列，可判断帕累托效应
    question_template: "{num0}在{cat0}上是否集中？"
    goal_template: "{num0}的集中度分析"
