# 相关分析 —— 数值指标间的关联关系
# V3：扩展为完整分析知识
intent: correlation
display_name: 相关分析
description: 分析两个或多个数值指标之间的关联关系强度（Pearson/Spearman），输出相关性矩阵
level: L1

template: correlation_analysis
template_module: src.analysis_templates.correlation_analysis.CorrelationAnalysis
calculator: src.calculators.correlation.CorrelationCalculator
default_algorithm: pearson
supported_algorithms:
  - pearson
  - spearman

keywords:
  - 相关
  - 关联
  - 关系
  - 影响
  - 伴随
  - 相关系
  - 相关性
  - 散点
  - 相关性分析

business_questions:
  - 销售额和利润相关吗？
  - 广告费和收入有关系吗？
  - 两个指标之间是否存在关联？
  - 哪些指标互相影响？

priority: 78

schema_requirements:
  dimension_type: ""
  metric_type: numeric
  min_dimension: 0
  min_metric: 2
  min_rows: 3
  min_distinct_values: 2

required_fields:
  - 销售额
  - 利润
  - 数量
  - 金额

outputs:
  charts:
    - name: scatter_plot
      label: 散点图
      description: 两两指标的相关性散点图
  tables:
    - name: correlation_matrix
      label: 相关性矩阵
      description: 所有数值列两两之间的相关系数
  kpis:
    - name: correlation_coefficient
      label: 相关系数
      description: Pearson/Spearman相关系数（-1~1）
    - name: method
      label: 计算方法
      description: 使用的相关系数计算方法
    - name: sample_size
      label: 样本量
      description: 有效数据行数

derived_metrics:
  - pearson_r
  - spearman_rho
  - correlation_pairs

examples:
  - 销售额和利润相关吗？
  - 广告费和收入有关系吗？
  - 两个指标之间是否存在关联？

fallback:
  - ranking

generator_rules:
  - requires: ["multi_numeric"]
    priority: medium
    reason: 有多个数值指标，可探索关联关系
    question_template: "{num0}和另一个指标是否相关？"
    goal_template: "{num0}的相关关系分析"
