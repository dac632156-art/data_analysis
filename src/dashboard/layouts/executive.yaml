name: executive
description: 管理层驾驶舱 - Hero KPI 顶栏 + 大图左右 + 小图底部
columns: 12
hero_cols: 12

section_order:
  - header
  - hero
  - main
  - secondary
  - footer

size_grid:
  hero:    [12, 3]   # 全宽 × 3 — KPI 横条
  large:   [6,  3]   # 半宽 × 3 — 主要趋势/对比
  medium:  [4,  3]   # 1/3 × 3 — 分类/结构
  small:   [3,  2]   # 1/4 × 2 — 辅助指标

section_gap: 2
widget_gap: 1
page_margin: 1
max_section_weight: 24
rebalance_enabled: true

hero_max: 1
main_per_row: 3
