name: compact
description: 紧凑布局 - 适合 KPI 密集场景：Hero 概览 + 小图四列
columns: 12
hero_cols: 12

section_order:
  - header
  - hero
  - main
  - secondary
  - footer

size_grid:
  hero:    [12, 3]   # 全宽 — KPI 概览
  large:   [4,  2]   # 1/3 — 核心指标
  medium:  [3,  2]   # 1/4 — 辅助指标
  small:   [2,  2]   # 1/6 — 微指标

section_gap: 1
widget_gap: 1
page_margin: 1
max_section_weight: 24
rebalance_enabled: true
hero_max: 1
main_per_row: 4
