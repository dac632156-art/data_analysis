name: geo
description: 地理分析布局 - 适合地图为主、区域排名为辅的场景
columns: 12
hero_cols: 8  # 地图占 8 列，右侧留区域排名

section_order:
  - header
  - hero
  - main
  - secondary
  - footer

size_grid:
  hero:    [8, 5]   # 大尺寸地图
  large:   [4, 5]   # 地图旁放排名
  medium:  [4, 3]
  small:   [3, 2]

section_gap: 1
widget_gap: 1
page_margin: 1
max_section_weight: 20
rebalance_enabled: true
main_per_row: 3
