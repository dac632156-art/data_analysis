<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Data Analysis AI Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 1. 全局布局 */
        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            overflow: hidden;
            padding: 24px;
            gap: 24px;
            position: relative;
        }

        /* 2. 背景层 */
        body::before {
            content: "";
            position: fixed;
            top: -150px;
            left: -150px;
            right: -150px;
            bottom: -150px;
            background: url('./bg.png') center / cover no-repeat;
            z-index: -1;
            /* 背景位移参数 */
            transform: translate(45px, -45px); 
        }

        /* 3. 毛玻璃通用样式 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.02);
        }

        /* 4. 左侧边栏 */
        aside {
            width: 260px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 24px;
        }

        /* Logo 区域样式更新：替换 Emoji 为精致的 CSS 渐变圆圈 */
        .logo-area {
            font-size: 15px;
            font-weight: 600;
            color: #1E293B;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 4px 8px;
        }
        
        .logo-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            /* 模拟设计图上的蓝粉相间柔和渐变 */
            background: radial-gradient(circle at 30% 30%, #a1c4fd 0%, #c2e9fb 30%, #ffc3a0 70%, #ffafbd 100%);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            list-style: none;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-item svg {
            width: 18px;
            height: 18px;
            stroke: #64748B;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s;
        }

        .nav-item.active, .nav-item:hover {
            background: rgba(255, 255, 255, 0.5);
            color: #0F172A;
            font-weight: 500;
        }

        .nav-item.active svg, .nav-item:hover svg {
            stroke: #0F172A;
        }

        /* 5. 右侧主内容区 */
        main {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        /* 6. 中央上传区 */
        .upload-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: transparent;
            border: none;
            box-shadow: none;
        }

        .upload-dropzone-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .ring-container {
            position: relative;
            width: 360px;
            height: 360px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .ring-container:hover {
            transform: scale(1.02);
        }

        .donut-mask-wrapper {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            -webkit-mask: radial-gradient(circle at center, transparent 105px, black 105.5px);
            mask: radial-gradient(circle at center, transparent 105px, black 105.5px);
            transform: translateZ(0);
        }

        .frosted-donut {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .outer-border {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.45);
            box-shadow: 
                inset 0 0 20px rgba(255, 255, 255, 0.3),
                0 0 20px rgba(255, 255, 255, 0.15);
            pointer-events: none;
        }

        .inner-border {
            position: absolute;
            width: 210px;
            height: 210px;
            border-radius: 50%;
            background: transparent;
            border: 4px solid rgba(255, 255, 255, 0.6);
            box-shadow: 
                inset 0 0 15px rgba(255, 255, 255, 0.3),
                0 0 15px rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 中央粉色文档图标更新：放大尺寸，更改颜色 */
        .doc-icon {
            width: 54px; /* 从 38px 放大到 54px */
            height: 54px;
            stroke: #EAADC2; /* 更新为指定的浅粉色 */
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 7. 底部文件列表区样式 */
        .file-list-section {
            height: 240px;
            padding: 20px 28px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.48);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.01);
        }

        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: #334155;
            letter-spacing: 0.3px;
        }

        .file-items-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            max-height: 160px;
            padding-right: 4px;
            /* 兼容 Firefox 滚动条 */
            scrollbar-width: thin;
            scrollbar-color: #f6f3f4 transparent;
        }

        /* 自定义 Webkit (Chrome/Safari/Edge) 滚动条为淡粉色 */
        .file-items-container::-webkit-scrollbar {
            width: 6px;
        }

        .file-items-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .file-items-container::-webkit-scrollbar-thumb {
            background: #fbcfe8; /* 淡粉色 */
            border-radius: 10px;
        }

        .file-items-container::-webkit-scrollbar-thumb:hover {
            background: #f472b6; /* 悬停时稍微加深一点 */
        }

        .file-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.52);
            padding: 12px 20px;
            border-radius: 14px;
            transition: all 0.2s;
        }

        .file-row:hover {
            background: rgba(255, 255, 255, 0.48);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
            color: #334155;
            width: 32%;
        }

        .file-icon-box {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.38);
            border: 1px solid rgba(255, 255, 255, 0.62);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .file-icon-box svg {
            width: 16px;
            height: 16px;
            stroke: #64748B;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .file-meta { font-size: 13px; color: #64748B; width: 22%; }
        .file-size { font-size: 13px; color: #64748B; width: 15%; }

        .status-badge {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-verified { background: rgba(224, 171, 240, 0.6); color: #553355; }
        .status-pending { background: rgba(254, 226, 226, 0.6); color: #991B1B; }
        .status-archived { background: rgba(237, 233, 254, 0.6); color: #5B21B6; }

        .file-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .action-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            color: #94A3B8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: color 0.2s;
        }

        .action-btn:hover { 
            color: #475569;
        }

        .action-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>

    </aside>
